name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: sign-package-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62

      - name: Install cpak-sign
        run: |
          curl -fsSLO https://github.com/Containerpak/cpak/releases/download/v2.9.7/cpak-sign-linux-amd64
          echo '240583cbbda17dbf04712a769af4bf89caf65497a88ba1ae352bb56c0b5c50b8  cpak-sign-linux-amd64' | sha256sum -c -
          install -Dm755 cpak-sign-linux-amd64 /usr/local/bin/cpak-sign

      - name: Sign the package state
        env:
          CPAK_REGISTRY_USERNAME: ${{ github.actor }}
          CPAK_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="$(jq -r '.image' cpak.json)"
          platforms=0
          while IFS=$'\t' read -r os architecture digest; do
            test "$os" = linux
            state="cpak-state-${architecture}"
            bundle="${state}.sigstore.json"
            cpak-sign state --origin "github.com/${repository}" --generation "${{ github.run_number }}" --image-digest "$digest" --output "$state"
            cosign sign-blob --yes --new-bundle-format=true --bundle "$bundle" "$state"
            cpak-sign attach --image "${image%@*}" --state "$state" --bundle "$bundle"
            platforms=$((platforms + 1))
          done < <(docker buildx imagetools inspect --raw "$image" | jq -r '.manifests[] | [.platform.os, .platform.architecture, .digest] | @tsv')
          test "$platforms" -gt 0
